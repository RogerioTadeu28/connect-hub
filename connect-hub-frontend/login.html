<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Cash</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Smart Cash</h1>
            <p class="subtitle">Controle financeiro inteligente</p>

            <!-- Formulário de Login -->
            <div id="loginFormContainer">
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="E-mail" required>
                    <input type="password" id="loginPassword" placeholder="Senha" required>
                    <button type="submit">Entrar</button>
                </form>
                <div class="toggle-link" id="showRegister">Não tem conta? Cadastre-se</div>
                <div id="loginError" class="error-msg"></div>
            </div>

            <!-- Formulário de Cadastro -->
            <div id="registerFormContainer" style="display:none;">
                <form id="registerForm">
                    <input type="text" id="regName" placeholder="Nome completo" required>
                    <input type="email" id="regEmail" placeholder="E-mail" required>
                    <input type="password" id="regPassword" placeholder="Senha" required>
                    <button type="submit">Criar conta</button>
                </form>
                <div class="toggle-link" id="showLogin">Já tem conta? Faça login</div>
                <div id="registerError" class="error-msg"></div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
